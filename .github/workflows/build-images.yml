name: Build and publish Docker images for Energy Tracker

on:
  push:
    branches: [ "staging", "main" ]
  pull_request:
    branches: [ "staging", "main" ]

env:
  REGISTRY: ghcr.io
  PROVER_IMAGE_NAME: ${{ github.repository }}
  STREAMR_IMAGE_NAME: ${{ github.repository }}/streamr-client

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Free up ~15-30 GB by removing unused pre-installed tools/packages
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main  # Reliable community action (or endersonmenezes/free-disk-space@v3)
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # Multi-platform setup
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login only on push
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Prover image (energy-tracker)
      - name: Extract metadata for Prover image
        id: meta-prover
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.PROVER_IMAGE_NAME }}

      - name: Build and push Prover image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-prover.outputs.tags }}
          labels: ${{ steps.meta-prover.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.PROVER_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.PROVER_IMAGE_NAME }}:buildcache,mode=max

      - name: Generate attestation for Prover image
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.PROVER_IMAGE_NAME }}
          subject-digest: ${{ steps.docker_build_prover.outputs.digest }}
          push-to-registry: true

      # Streamr client image
      - name: Extract metadata for Streamr client image
        id: meta-streamr
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.STREAMR_IMAGE_NAME }}

      - name: Build and push Streamr client image
        uses: docker/build-push-action@v6
        with:
          context: ./streamr-client
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-streamr.outputs.tags }}
          labels: ${{ steps.meta-streamr.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.STREAMR_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.STREAMR_IMAGE_NAME }}:buildcache,mode=max

      - name: Generate attestation for Streamr client image
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.STREAMR_IMAGE_NAME }}
          subject-digest: ${{ steps.docker_build_streamr.outputs.digest }}
          push-to-registry: true