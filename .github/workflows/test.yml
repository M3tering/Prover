name: Protocol
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.1
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler pkg-config libssl-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p m3tering-protocol -p m3tering-prover
      - run: cargo build --locked -p m3tering-prover --features proving
      - name: Install pinned SP1
        run: |
          curl -L https://sp1up.succinct.xyz | bash
          "$HOME/.sp1/bin/sp1up" --version v6.3.1
          echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"
      - name: Build guest
        run: cargo prove build --locked -p m3tering-program --output-directory elf
      - name: Execute authenticated fixture without buying a proof
        env:
          SP1_ELF: elf/m3tering-program
          WITNESS_FILE: fixtures/input.json
        run: |
          cargo run --locked -p m3tering-prover --features proving -- execute-fixture | tee execution.log
          key=$(jq -r .program_key release/program-build.json)
          grep -F "Program verification key: $key" execution.log

  ingestion:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm@sha256:d81f7b51697014367236d07ec58b54153fc28f828b72bf247fe5c7487520bcb0
        env:
          POSTGRES_USER: m3tering
          POSTGRES_PASSWORD: validation-only
          POSTGRES_DB: m3tering
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U m3tering" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: streamr-client/package-lock.json
      - run: npm ci --prefix streamr-client
      - run: npm test --prefix streamr-client
        env:
          TEST_DATABASE_URL: postgres://m3tering:validation-only@localhost:5432/m3tering
      - run: sha256sum -c release/program.sha256
      - run: docker build --target api .
