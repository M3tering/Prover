
# You must create `db/password.txt` and add
# a password of your choosing to it before running `docker compose up`.

services:
  db:
    image: postgres:15
    restart: always
    user: postgres
    secrets:
      - db-password
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=m3tering-db
      - POSTGRES_USER=m3tering
      - POSTGRES_PASSWORD_FILE=/run/secrets/db-password
    expose:
      - 5432
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  energy-tracker:
    build:
      context: .
    ports:
      - 8080:8080
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://m3tering:db-password@db:5432/m3tering-db}
    depends_on:
      db:
        condition: service_healthy
    image: energy-tracker.public.dappnode.eth:0.1.0
    restart: unless-stopped

volumes:
  db-data:
secrets:
  db-password:
    file: db/password.txt
